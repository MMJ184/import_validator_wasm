  [".github/workflows/ci.yml", "bindings/go/import_validator.go"],
  [".github/workflows/release-native.yml", "scripts/build-native.sh"],

  ["docs/ARCHITECTURE.md", "docs/CODE_MAP.md"],
  ["docs/ARCHITECTURE.md", "docs/PERFORMANCE.md"],
  ["docs/PERFORMANCE.md", "docs/BENCHMARKS.md"],
  ["docs/INDEX.md", "docs/ARCHITECTURE.md"],
  ["docs/INDEX.md", "docs/SCHEMA_REFERENCE.md"],
  ["docs/INDEX.md", "docs/SDK_API.md"],
  ["docs/INDEX.md", "docs/guides/"],
  ["docs/SCHEMA_REFERENCE.md", "docs/validation-config.schema.json"],
  ["docs/SDK_API.md", "packages/sdk/src/index.ts"],
  ["docs/guides/", "bindings/python/import_validator.py"],
  ["docs/guides/", "bindings/csharp/ImportValidator.cs"],
  ["docs/guides/", "bindings/go/import_validator.go"],
  ["docs/guides/", "packages/node/src/index.ts"],
  ["docs/guides/", "crates/validator/src/api.rs"],
  ["docs/SCHEMA_REFERENCE.md", "crates/validator/src/schema.rs"],
];

// ── Build graph structures ───────────────────────────────────────────────────
const nodes = NODES_RAW.map(([id, area, desc], i) => ({
  i, id, area, desc,
  label: id.replace(/\/$/, "").split("/").pop(),
  x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
  sx: 0, sy: 0, ss: 1, depth: 0,
  degree: 0,
}));
const byId = new Map(nodes.map(n => [n.id, n]));
const edges = EDGES_RAW
  .filter(([a, b]) => byId.has(a) && byId.has(b))
  .map(([a, b]) => ({ a: byId.get(a), b: byId.get(b) }));
for (const e of edges) { e.a.degree++; e.b.degree++; }
const neighbors = new Map(nodes.map(n => [n, new Set()]));
for (const e of edges) { neighbors.get(e.a).add(e.b); neighbors.get(e.b).add(e.a); }

// deterministic-ish seeded placement on a sphere, clustered by area
const areaKeys = Object.keys(AREAS);
let seed = 1337;
const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const areaCenters = new Map(areaKeys.map((k, idx) => {
  const phi = Math.acos(1 - 2 * (idx + 0.5) / areaKeys.length);
  const theta = Math.PI * (1 + Math.sqrt(5)) * idx;
  const R = 240;
  return [k, {
    x: R * Math.sin(phi) * Math.cos(theta),
    y: R * Math.sin(phi) * Math.sin(theta),
    z: R * Math.cos(phi),
  }];
}));
for (const n of nodes) {
  const c = areaCenters.get(n.area);
  n.x = c.x + (rand() - 0.5) * 160;
  n.y = c.y + (rand() - 0.5) * 160;
  n.z = c.z + (rand() - 0.5) * 160;
}

// ── Simulation ───────────────────────────────────────────────────────────────
let alpha = 1;
function tick() {
  const REPULSE = 5200, SPRING = 0.028, REST = 95, CENTER = 0.0016, DAMP = 0.86;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
      let d2 = dx * dx + dy * dy + dz * dz + 0.01;
      if (d2 > 250000) continue;
      const f = Math.min(REPULSE / d2, 12) * alpha;
      const d = Math.sqrt(d2);
      dx /= d; dy /= d; dz /= d;
      a.vx += dx * f; a.vy += dy * f; a.vz += dz * f;
      b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
    }
  }
  for (const e of edges) {
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, dz = e.b.z - e.a.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.01;
    const f = (d - REST) * SPRING * alpha;
    const ux = dx / d, uy = dy / d, uz = dz / d;
    e.a.vx += ux * f; e.a.vy += uy * f; e.a.vz += uz * f;
    e.b.vx -= ux * f; e.b.vy -= uy * f; e.b.vz -= uz * f;
  }
  for (const n of nodes) {
    n.vx -= n.x * CENTER * alpha;
    n.vy -= n.y * CENTER * alpha;
    n.vz -= n.z * CENTER * alpha;
    n.vx *= DAMP; n.vy *= DAMP; n.vz *= DAMP;
    n.x += n.vx; n.y += n.vy; n.z += n.vz;
  }
  alpha = Math.max(0.02, alpha * 0.996);
}

// ── Rendering ────────────────────────────────────────────────────────────────
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
window.addEventListener("resize", resize);
resize();

let rotX = -0.28, rotY = 0.6, zoom = 1.05;
const FOCAL = 1050;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let autoRotate = !reducedMotion;

let selected = null, hovered = null;
let searchTerm = "";
const areaOn = Object.fromEntries(areaKeys.map(k => [k, true]));

function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return !window.matchMedia("(prefers-color-scheme: light)").matches;
}

function project() {
  const cX = Math.cos(rotX), sX = Math.sin(rotX);
  const cY = Math.cos(rotY), sY = Math.sin(rotY);
  for (const n of nodes) {
    // rotate Y then X
    const x1 = n.x * cY + n.z * sY;
    const z1 = -n.x * sY + n.z * cY;
    const y2 = n.y * cX - z1 * sX;
    const z2 = n.y * sX + z1 * cX;
    const s = FOCAL / (FOCAL + z2);
    n.sx = W / 2 + x1 * s * zoom;
    n.sy = H / 2 + y2 * s * zoom;
    n.ss = s * zoom;
    n.depth = z2;
  }
}

function nodeVisibility(n) {
  // 1 = full, dimmed values for filtered/unfocused
  let v = areaOn[n.area] ? 1 : 0.06;
  if (searchTerm) {
    v = Math.min(v, n.id.toLowerCase().includes(searchTerm) ? 1 : 0.08);
  }
  if (selected) {
    const related = n === selected || neighbors.get(selected).has(n);
    v = Math.min(v, related ? 1 : 0.07);
  }
  return v;
}

function draw() {
  const dark = isDark();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // subtle depth vignette
  const bgGlow = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, Math.max(W, H) * 0.75);
  if (dark) {
    bgGlow.addColorStop(0, "rgba(52,66,94,0.16)");
    bgGlow.addColorStop(1, "rgba(0,0,0,0)");
  } else {
    bgGlow.addColorStop(0, "rgba(255,255,255,0.75)");
    bgGlow.addColorStop(1, "rgba(255,255,255,0)");
  }
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, W, H);

  // edges
  ctx.lineWidth = 1;
  for (const e of edges) {
    const va = nodeVisibility(e.a), vb = nodeVisibility(e.b);
    const v = Math.min(va, vb);
    if (v <= 0.061) continue;
    const depthFade = Math.max(0.25, Math.min(1, (FOCAL - (e.a.depth + e.b.depth) / 2) / FOCAL));
    const base = dark ? 190 : 90;
    const focusEdge = selected && (e.a === selected || e.b === selected);
    ctx.strokeStyle = focusEdge
      ? (dark ? `rgba(232,236,243,${0.65 * depthFade})` : `rgba(26,34,48,${0.55 * depthFade})`)
      : (dark ? `rgba(${base},${base + 12},${base + 30},${0.16 * depthFade * v})`
              : `rgba(${base},${base + 8},${base + 20},${0.22 * depthFade * v})`);
    ctx.beginPath();
    ctx.moveTo(e.a.sx, e.a.sy);
    ctx.lineTo(e.b.sx, e.b.sy);
    ctx.stroke();
  }

  // nodes back-to-front
  const order = [...nodes].sort((a, b) => b.depth - a.depth);
  ctx.textBaseline = "middle";
  for (const n of order) {
    const v = nodeVisibility(n);
    const color = AREAS[n.area].color;
    const r = (3.4 + Math.min(9, n.degree * 0.8)) * n.ss;
    const depthFade = Math.max(0.35, Math.min(1, (FOCAL - n.depth) / FOCAL));
    const a = v * depthFade;

    if (a > 0.5 && (n === hovered || n === selected)) {
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = hexA(color, 0.22);
      ctx.fill();
    }
    // glow
    if (a > 0.2) {
      const g = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, r * 2.6);
      g.addColorStop(0, hexA(color, 0.5 * a));
      g.addColorStop(1, hexA(color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.fillStyle = hexA(color, Math.max(0.12, a));
    ctx.fill();
    if (n === selected) {
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = dark ? "#e8ecf3" : "#1a2230";
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    // labels: hovered, selected, neighbors of selected, or hubs when zoomed
    const showLabel =
      a > 0.4 &&
      (n === hovered || n === selected ||
        (selected && neighbors.get(selected).has(n)) ||
        (!selected && !searchTerm && n.degree >= 7 && zoom > 0.9) ||
        (searchTerm && n.id.toLowerCase().includes(searchTerm)) ||
        zoom > 2.1);
    if (showLabel) {
      const fs = Math.max(10, Math.min(13, 11 * n.ss));
      ctx.font = `${n === selected ? "600 " : ""}${fs}px ui-monospace, SF Mono, Menlo, Consolas, monospace`;
      const tx = n.sx + r + 6, ty = n.sy;
      const tw = ctx.measureText(n.label).width;
      ctx.fillStyle = dark ? `rgba(14,17,22,${0.75 * a})` : `rgba(245,246,248,${0.85 * a})`;
      ctx.fillRect(tx - 3, ty - fs * 0.75, tw + 6, fs * 1.5);
      ctx.fillStyle = dark ? `rgba(232,236,243,${a})` : `rgba(26,34,48,${a})`;
      ctx.fillText(n.label, tx, ty);
    }
  }
}

function hexA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha))})`;
}

// ── Interaction ──────────────────────────────────────────────────────────────
let dragging = false, moved = false, lastX = 0, lastY = 0, vRotX = 0, vRotY = 0;

canvas.addEventListener("pointerdown", (e) => {
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    rotY += dx * 0.005; rotX += dy * 0.005;
    vRotY = dx * 0.005; vRotX = dy * 0.005;
    rotX = Math.max(-1.5, Math.min(1.5, rotX));
    lastX = e.clientX; lastY = e.clientY;
    autoRotate = false;
  } else {
    hovered = pick(e.clientX, e.clientY);
    canvas.style.cursor = hovered ? "pointer" : "grab";
  }
});
window.addEventListener("pointerup", (e) => {
  if (dragging && !moved) {
    const n = pick(e.clientX, e.clientY);
    select(n === selected ? null : n);
  }
  dragging = false;
  canvas.classList.remove("dragging");
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom *= Math.exp(-e.deltaY * 0.0011);
  zoom = Math.max(0.3, Math.min(3.4, zoom));
}, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { select(null); searchInput.value = ""; searchTerm = ""; }
});

function pick(px, py) {
  let best = null, bestD = 18 * 18;
  for (const n of nodes) {
    if (nodeVisibility(n) < 0.5) continue;
    const dx = n.sx - px, dy = n.sy - py;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

// ── Detail card ──────────────────────────────────────────────────────────────
const card = document.getElementById("card");
const cardPath = document.getElementById("cardPath");
const cardArea = document.getElementById("cardArea");
const cardDot = document.getElementById("cardDot");
const cardDesc = document.getElementById("cardDesc");
const cardLinks = document.getElementById("cardLinks");
document.getElementById("cardClose").addEventListener("click", () => select(null));

function select(n) {
  selected = n;
  if (!n) { card.classList.remove("show"); return; }
  cardPath.textContent = n.id;
  cardArea.textContent = AREAS[n.area].label;
  cardDot.style.background = AREAS[n.area].color;
  cardDesc.textContent = n.desc;
  cardLinks.innerHTML = "";
  const ns = [...neighbors.get(n)].sort((a, b) => b.degree - a.degree);
  for (const m of ns) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.textContent = m.id;
    btn.style.borderLeft = `3px solid ${AREAS[m.area].color}`;
    btn.addEventListener("click", () => select(m));
    li.appendChild(btn);
    cardLinks.appendChild(li);
  }
  document.getElementById("cardLinksH").textContent = `Connections (${ns.length})`;
  card.classList.add("show");
  alpha = Math.max(alpha, 0.12);
}

// ── Search + chips ───────────────────────────────────────────────────────────
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", () => {
  searchTerm = searchInput.value.trim().toLowerCase();
});
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && searchTerm) {
    const match = nodes
      .filter(n => n.id.toLowerCase().includes(searchTerm))
      .sort((a, b) => b.degree - a.degree)[0];
    if (match) select(match);
  }
});

const chipsEl = document.getElementById("chips");
for (const k of areaKeys) {
  const chip = document.createElement("button");
  chip.className = "chip on";
  chip.style.setProperty("--c", AREAS[k].color);
  chip.innerHTML = `<span class="dot"></span>${AREAS[k].label}`;
  chip.setAttribute("aria-pressed", "true");
  chip.addEventListener("click", () => {
    areaOn[k] = !areaOn[k];
    chip.classList.toggle("on", areaOn[k]);
    chip.setAttribute("aria-pressed", String(areaOn[k]));
  });
  chipsEl.appendChild(chip);
}

// ── Main loop ────────────────────────────────────────────────────────────────
function frame() {
  if (alpha > 0.021) tick();
  if (autoRotate) rotY += 0.0016;
  else if (!dragging) {
    rotY += vRotY *= 0.94;
    rotX = Math.max(-1.5, Math.min(1.5, rotX + (vRotX *= 0.94)));
  }
  project();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
