name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/validator

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test --manifest-path crates/validator/Cargo.toml

      # Build before typecheck: worker/sdk type resolution needs core's dist
      # and the generated wasm pkg, neither of which exist on a fresh checkout.
      - name: Build (traced)
        run: pnpm run build:trace

      - name: Typecheck
        run: pnpm run typecheck

      - name: JS tests
        run: pnpm run test

      - name: Assemble customer kit
        run: pnpm run dist:customer

      - name: Upload build traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-traces
          path: artifacts/build-traces

      - name: Upload customer kit
        uses: actions/upload-artifact@v4
        with:
          name: customer-kit
          path: artifacts/import-validator-kit-*.zip
