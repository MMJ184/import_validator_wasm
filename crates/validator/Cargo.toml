[package]
name = "import-validator"
version = "0.2.0"
edition = "2021"
description = "High-performance streaming CSV/XLSX validation engine (WASM + native C ABI + Rust API)"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/mmj/import-validator"
keywords = ["csv", "xlsx", "validation", "wasm", "streaming"]
categories = ["parser-implementations", "wasm"]
readme = "README.md"

[lib]
name = "import_validator"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast streaming CSV parser
csv-core = "0.1"
regex = { version = "1", optional = true }

# Deterministic decimals (avoid floats); serde feature not needed
rust_decimal = { version = "1", default-features = false, features = ["std"] }

# Small, deterministic date handling
time = { version = "0.3", features = ["parsing", "formatting"] }

# SIMD-accelerated byte scanning (also used by csv-core internally)
memchr = "2"

# Single-pass 128-bit content fingerprints for uniqueness tracking
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Fast non-cryptographic hasher for header maps / allowed-value sets
rustc-hash = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# Optional: better panic messages in dev
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Streaming DEFLATE for the native one-shot XLSX path (browser uses
# DecompressionStream instead, so the WASM binary never carries this).
miniz_oxide = "0.8"

[dev-dependencies]
# ZIP fixture generation in integration tests
miniz_oxide = "0.8"

[features]
default = []
dev = ["console_error_panic_hook"]
pattern = ["dep:regex"]

# Shipped binaries (WASM + native cdylib) — favor throughput and small size.
# Tests are unaffected: cargo test uses the dev/test profile.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
