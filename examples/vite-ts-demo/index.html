<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Import Validator Demo (Vite)</title>
</head>
<body>
<div class="bg-shape bg-shape-a"></div>
<div class="bg-shape bg-shape-b"></div>

<main id="app" class="shell">
    <header class="hero">
        <p class="eyebrow">Import Validator</p>
        <h1>WASM Validation Console</h1>
        <p class="hero-copy">
            Validate uploads with streaming performance and clear runtime diagnostics.
        </p>
    </header>

    <section class="grid">
        <div class="card card-controls">
            <h2>Run Validation</h2>
            <label class="field-label" for="file">CSV / Excel File</label>
            <input id="file" type="file" accept=".csv,text/csv,.xlsx,.xls" />

            <label class="checkbox-row">
                <input id="estimate" type="checkbox" />
                Estimate before validate
            </label>

            <label class="checkbox-row">
                <input id="estimateOnly" type="checkbox" />
                Estimate only (skip validation)
            </label>

            <label class="field-label" for="format">Validation Route</label>
            <select id="format">
                <option value="auto" selected>Auto (by file extension)</option>
                <option value="csv">CSV route</option>
                <option value="excel">Excel route (.xlsx)</option>
            </select>

            <p class="help-note">
                Sample files: <code>demo_100.csv</code>, <code>demo_10000.csv</code>,
                <code>demo_100.xlsx</code>, <code>demo_10000.xlsx</code>
            </p>

            <button id="run" type="button">Validate File</button>
        </div>

        <div class="card">
            <h2>Status</h2>
            <pre id="status">Idle</pre>
        </div>

        <div class="card">
            <h2>Metrics</h2>
            <pre id="metrics">(none)</pre>
        </div>

        <div class="card card-errors">
            <h2>Errors</h2>
            <pre id="errors">(none)</pre>
        </div>
    </section>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
