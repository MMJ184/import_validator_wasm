<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import Validator · WASM Demo</title>
</head>
<body>
<div id="root">

  <nav class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <span class="topbar-name">Import Validator</span>
      <span class="topbar-pill">WASM</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="topbar-tagline">CSV &amp; Excel · Rust-powered</span>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <!-- sun icon (shown in dark mode) -->
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- moon icon (shown in light mode) -->
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="layout">

    <!-- ── Sidebar: controls ── -->
    <aside class="sidebar">
      <div class="scroll-area">

        <div class="sidebar-section">
          <p class="section-label">File</p>

          <label id="uploadZone" class="upload-zone" for="file">
            <svg class="upload-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="upload-text">Drop CSV or Excel file</span>
            <span class="upload-sub">or click to browse</span>
            <input id="file" type="file" accept=".csv,text/csv,.xlsx,.xls" />
          </label>

          <div id="fileName" class="file-badge hidden">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span id="fileNameText"></span>
          </div>
        </div>

        <div class="sidebar-section">
          <p class="section-label">Options</p>

          <div class="field">
            <label class="field-label" for="format">Validation route</label>
            <div class="select-wrap">
              <select id="format">
                <option value="auto" selected>Auto-detect</option>
                <option value="csv">Force CSV</option>
                <option value="excel">Force Excel</option>
              </select>
              <svg class="select-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>

          <div class="toggles">
            <label class="toggle">
              <input id="estimate" type="checkbox" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-text">Estimate before validate</span>
            </label>
            <span class="cost-hint">costs +1 full file scan</span>
            <label class="toggle">
              <input id="estimateOnly" type="checkbox" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-text">Estimate only (skip validation)</span>
            </label>
          </div>
        </div>

        <div class="sidebar-section">
          <details class="accordion">
            <summary class="accordion-hd">
              <span>Modifiers</span>
              <svg class="accordion-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </summary>
            <div class="accordion-body">

              <div class="toggles">
                <label class="toggle">
                  <input id="modTrimCollapse" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Trim + collapse whitespace</span>
                </label>
                <label class="toggle">
                  <input id="modTitleCase" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Title-case names</span>
                </label>
                <label class="toggle">
                  <input id="modEmailLowercase" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Lowercase email</span>
                </label>
                <label class="toggle">
                  <input id="modUnique" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Unique checks</span>
                </label>
                <span class="cost-hint">holds all values in memory</span>
                <label class="toggle">
                  <input id="modCompositeUnique" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Composite uniqueness</span>
                </label>
                <span class="cost-hint">builds a key for every row</span>
              </div>

              <div class="field-pair">
                <div class="field">
                  <label class="field-label" for="namePrefix">Name prefix</label>
                  <input id="namePrefix" type="text" placeholder="e.g. Mr." />
                </div>
                <div class="field">
                  <label class="field-label" for="nameSuffix">Name suffix</label>
                  <input id="nameSuffix" type="text" placeholder="e.g. Jr." />
                </div>
              </div>

              <div class="field">
                <label class="field-label" for="amountScale">Amount decimal digits</label>
                <input id="amountScale" type="number" min="0" max="8" step="1" value="2" />
              </div>

              <div class="field-pair">
                <div class="field">
                  <label class="field-label" for="nameSubstringStart">Substring start</label>
                  <input id="nameSubstringStart" type="number" min="0" step="1" placeholder="—" />
                </div>
                <div class="field">
                  <label class="field-label" for="nameSubstringEnd">Substring end</label>
                  <input id="nameSubstringEnd" type="number" min="0" step="1" placeholder="—" />
                </div>
              </div>

              <div class="field-pair">
                <div class="field">
                  <label class="field-label" for="nameReplaceFrom">Replace from</label>
                  <input id="nameReplaceFrom" type="text" placeholder="e.g. 0" />
                </div>
                <div class="field">
                  <label class="field-label" for="nameReplaceTo">Replace to</label>
                  <input id="nameReplaceTo" type="text" placeholder="e.g. o" />
                </div>
              </div>

              <div class="field">
                <label class="field-label" for="nullTokens">Null tokens (comma-separated)</label>
                <input id="nullTokens" type="text" placeholder="N/A, NULL, -" value="N/A,NULL,-" />
              </div>

            </div>
          </details>
        </div>

      </div><!-- /scroll-area -->

      <div class="sidebar-footer">
        <button id="run" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Validate File
        </button>
      </div>
    </aside>

    <!-- ── Main pane: results ── -->
    <main class="pane">

      <div class="status-bar" id="statusBar" data-state="idle">
        <span class="status-dot"></span>
        <span id="status" class="status-text">Idle — select a file and click Validate</span>
      </div>

      <div class="pane-body">

        <div class="result-card">
          <h2 class="card-title">Metrics</h2>
          <div id="metrics" class="metric-grid">
            <p class="empty-hint">No data yet</p>
          </div>
        </div>

        <div class="result-card result-card--errors">
          <h2 class="card-title">
            Errors
            <span id="errorCount" class="err-count hidden"></span>
          </h2>
          <div id="errors" class="error-list">
            <p class="empty-hint">No errors</p>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
